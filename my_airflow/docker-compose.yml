networks:
  spark_airflow_dev:

volumes:
  postgres-data-dev:

services:
  postgres:
    image: postgres:15
    container_name: postgres-dev
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - spark_airflow_dev

  unity-catalog:
    image: unitycatalog/unitycatalog:latest
    container_name: unity-catalog-dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/uc_metadata
      - SPRING_DATASOURCE_USERNAME=airflow
      - SPRING_DATASOURCE_PASSWORD=airflow
      - SERVER_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spark_airflow_dev
    volumes:
      - ./config/unity-catalog/server.properties:/home/unitycatalog/etc/conf/server.properties:ro
      - ./config/unity-catalog/hibernate.properties:/home/unitycatalog/etc/conf/hibernate.properties:ro

  airflow-webserver:
    user: "50000:0"
    build:
      context: .
      dockerfile: Dockerfile-airflow
    container_name: airflow-webserver-dev
    command: airflow webserver #bash -c "opentelemetry-instrument airflow webserver"
    ports:
      - "8801:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: always
    environment:
      - ENV=DEV 
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__WEBSERVER__HOST=0.0.0.0
      - AIRFLOW__WEBSERVER__PORT=8080
      - AIRFLOW__WEBSERVER__BASE_URL=http://airflow-webserver:8080
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_dev

      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow/webhook
      # SERVICE_NAME=zoho-people-airflow
      # EXPORTER_OTLP_ENDPOINT=http://164.52.195.88:4317
      # EXPORTER_OTLP_PROTOCOL=grpc
      # TRACES_EXPORTER=otlp
      # LOGS_EXPORTER=otlp
      # METRICS_EXPORTER=otlp
      # PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      # PYTHON_LOG_CORRELATION=true
      # LOG_LEVEL=info
      # RESOURCE_ATTRIBUTES=env=dev,system=zoho
    env_file:
      - ./agentic_ai/agentic_ai/backend/docker_compose/.env
      - ../.env
    volumes:
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/dags:/opt/airflow/dags
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/tests:/opt/airflow/tests
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/logs:/opt/airflow/logs
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/plugins:/opt/airflow/plugins
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/include:/opt/airflow/include
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/webhook:/opt/airflow/webhook
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/jars/mysql-connector-j-8.0.33.jar:/opt/jars/mysql-connector-j-8.0.33.jar:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
      # Delta Lake storage: Spark inside the container writes to this host path
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/delta_lake:/home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/delta_lake
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spark_airflow_dev

  airflow-scheduler:
    user: "50000:0"
    build:
      context: .
      dockerfile: Dockerfile-airflow
    container_name: airflow-scheduler-dev
    command: airflow scheduler #bash -c "opentelemetry-instrument airflow scheduler"
    restart: always
    environment:
      - ENV=DEV
      - AIRFLOW__WEBSERVER__HOST=0.0.0.0
      - AIRFLOW__WEBSERVER__PORT=8080
      - AIRFLOW__WEBSERVER__BASE_URL=http://airflow-webserver:8080
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_dev

      - PYTHONPATH=/opt/airflow/webhook
      # SERVICE_NAME=zoho-people-airflow
      # EXPORTER_OTLP_ENDPOINT=http://164.52.195.88:4317
      # EXPORTER_OTLP_PROTOCOL=grpc
      # TRACES_EXPORTER=otlp
      # LOGS_EXPORTER=otlp
      # METRICS_EXPORTER=otlp
      # PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      # PYTHON_LOG_CORRELATION=true
      # LOG_LEVEL=info
      # RESOURCE_ATTRIBUTES=env=dev,system=zoho
      # - AIRFLOW__LOGGING__LOG_FORMAT=%(asctime)s %(levelname)s dag_id=%(dag_id)s task_id=%(task_id)s run_id=%(run_id)s %(message)s

    env_file:
      - ./agentic_ai/agentic_ai/backend/docker_compose/.env
      - ../.env
    volumes:
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/dags:/opt/airflow/dags
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/tests:/opt/airflow/tests
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/logs:/opt/airflow/logs
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/plugins:/opt/airflow/plugins
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/include:/opt/airflow/include
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/webhook:/opt/airflow/webhook
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/jars/mysql-connector-j-8.0.33.jar:/opt/jars/mysql-connector-j-8.0.33.jar:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
      # Delta Lake storage: Spark inside the container writes to this host path
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/delta_lake:/home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/delta_lake
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    networks:
      - spark_airflow_dev

  airflow-worker:
    build:
      context: .
      dockerfile: Dockerfile-airflow
    container_name: airflow-worker
    command: airflow celery worker #bash -c "opentelemetry-instrument airflow celery worker"
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_dev
      - SPARK_HOME=/opt/bitnami/spark
      - PATH=/opt/bitnami/spark/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - PYSPARK_PYTHON=/usr/bin/python3
      - PYTHONPATH=/opt/airflow/webhook
      # SERVICE_NAME=zoho-people-airflow
      # EXPORTER_OTLP_ENDPOINT=http://164.52.195.88:4317
      # EXPORTER_OTLP_PROTOCOL=grpc
      # TRACES_EXPORTER=otlp
      # LOGS_EXPORTER=otlp
      # METRICS_EXPORTER=otlp
      # PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      # PYTHON_LOG_CORRELATION=true
      # LOG_LEVEL=info
      # RESOURCE_ATTRIBUTES=env=prod,system=zoho
      # - AIRFLOW__LOGGING__LOG_FORMAT=%(asctime)s %(levelname)s dag_id=%(dag_id)s task_id=%(task_id)s run_id=%(run_id)s %(message)s

    env_file:
      - ./agentic_ai/agentic_ai/backend/docker_compose/.env
      - ../.env
    volumes:
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/dags:/opt/airflow/dags
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/tests:/opt/airflow/tests
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/logs:/opt/airflow/logs
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/plugins:/opt/airflow/plugins
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/include:/opt/airflow/include
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/webhook:/opt/airflow/webhook
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/jars/mysql-connector-j-8.0.33.jar:/opt/jars/mysql-connector-j-8.0.33.jar:ro
      - /opt/bitnami/spark:/opt/bitnami/spark:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
      # Delta Lake storage: Spark inside the container writes to this host path
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/delta_lake:/home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/delta_lake
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    networks:
      - spark_airflow_dev

  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile-airflow
    container_name: airflow-triggerer
    command: airflow triggerer #bash -c "opentelemetry-instrument airflow triggerer"
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_dev

      # SERVICE_NAME=zoho-people-airflow
      # EXPORTER_OTLP_ENDPOINT=http://164.52.195.88:4317
      # EXPORTER_OTLP_PROTOCOL=grpc
      # TRACES_EXPORTER=otlp
      # LOGS_EXPORTER=otlp
      # METRICS_EXPORTER=otlp
      # PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      # PYTHON_LOG_CORRELATION=true
      # LOG_LEVEL=info
      # RESOURCE_ATTRIBUTES=env=prod,system=zoho
      
    env_file:
      - ./agentic_ai/agentic_ai/backend/docker_compose/.env
      - ../.env
    volumes:
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/dags:/opt/airflow/dags
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/tests:/opt/airflow/tests
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/logs:/opt/airflow/logs
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/plugins:/opt/airflow/plugins
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/include:/opt/airflow/include
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/webhook:/opt/airflow/webhook
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    networks:
      - spark_airflow_dev

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile-airflow
    container_name: airflow-init-dev
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create --username airflow --password airflow --firstname Admin --lastname User --role Admin --email admin@example.com
    environment:
      - ENV=DEV
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_dev

    env_file:
      - ./agentic_ai/agentic_ai/backend/docker_compose/.env
      - ../.env
    volumes:
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/dags:/opt/airflow/dags
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/tests:/opt/airflow/tests
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/logs:/opt/airflow/logs
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/plugins:/opt/airflow/plugins
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/include:/opt/airflow/include
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/webhook:/opt/airflow/webhook
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
      # Delta Lake storage: Spark inside the container writes to this host path
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/delta_lake:/home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev/delta_lake
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spark_airflow_dev

  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master-dev
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8082:8080" 
      - "7078:7077"
    volumes:
      - ./jars/mysql-connector-j-8.0.33.jar:/opt/spark/jars/mysql-connector-j-8.0.33.jar:ro
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/include:/opt/spark-app/include
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/webhook:/opt/airflow/webhook
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - spark_airflow_dev

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-dev-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    depends_on:
      - spark-master
    volumes:
      - ./jars/mysql-connector-j-8.0.33.jar:/opt/spark/jars/mysql-connector-j-8.0.33.jar:ro
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/include:/opt/spark-app/include
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/webhook:/opt/airflow/webhook
      - /home/mount_disk/Eclassifier-workspace/Data-engineer-airflow/hr_analytics_dev//my_airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - spark_airflow_dev
      
 
